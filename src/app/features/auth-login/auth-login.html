<!--
  D1: the wrapper composes and owns nothing else. The shell provides the two
  panels, the form owns every field, and all this template does is wire the
  form's eight members and its two outputs. No geometry here — the wrapper ships
  no stylesheet on purpose.
-->
<app-auth-shell>
  <app-login-form
    [form]="form"
    [(status)]="status"
    [(errors)]="errors"
    [(focused)]="focused"
    [(caps)]="caps"
    [showHint]="showHint()"
    (submitted)="onSubmitted()"
    (reset)="onReset()"
  />
</app-auth-shell>
